[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "sh /app/start.sh"
healthcheckPath = ""
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[deploy.volumes]]
mountPath = "/data"
name = "minecraft-data"

[service]
ports = [
  { port = 19132, protocol = "udp" }
]